name: checks

# Runs on every pull request and on main after a merge, and release.yml calls it before a release
# deploys. Not on plain branch pushes: that would run twice for any branch with an open pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces its old run. Runs on main always finish, so no merge
# goes unchecked.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every commit, because the secret scan below reads the whole history.
          fetch-depth: 0
          persist-credentials: false

      # A key that was committed and later deleted is still in the history, and still burned.
      # A pinned release, verified against its published checksum before it runs.
      - name: Scan the history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --retry 3 --retry-all-errors -sSfLO "$base/$tarball"
          curl --retry 3 --retry-all-errors -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          # A config that doesn't extend gitleaks' own rules replaces them with none.
          if [ -f "$GITHUB_WORKSPACE/.gitleaks.toml" ] \
             && ! grep -Eq '^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true' "$GITHUB_WORKSPACE/.gitleaks.toml"; then
            echo "::error::.gitleaks.toml does not extend gitleaks' own rules ([extend] useDefault = true)."
            exit 1
          fi
          # The history of the commit being checked, merge commits included.
          ./gitleaks git --redact --no-banner --no-color --exit-code 3 \
            --log-opts="--full-history --diff-merges=first-parent HEAD" "$GITHUB_WORKSPACE" 2>&1 | tee gitleaks.log
          # gitleaks exits 0 when the git command under it fails, having scanned nothing.
          if grep -Eq '(^|[^0-9])0 commits scanned|(^| )ERR( |$)' gitleaks.log; then
            echo "::error::gitleaks read no history, so nothing was scanned."
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.32'
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - name: Type-check
        run: uv run --frozen pyright
      - name: Test
        run: uv run --frozen pytest
      # The walking skeleton: the planted class set through every agent on the offline replay.
      - name: Smoke
        run: uv run --frozen python -m mothusi_core.smoke

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint and type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.32'
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install (locked)
        run: uv sync --frozen
      # Synthesises both stages and runs the runbook against a fake AWS: no credentials needed.
      - name: Test
        env:
          JSII_RUNTIME_PACKAGE_CACHE: disabled
        run: uv run --frozen pytest -q

  # The one check branch protection requires: green only when every job above is green.
  checks:
    if: always()
    needs: [secret-scan, python, web, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
