name: deploy

# Staging: automatic. Every push to main (a merged pull request) runs the full checks, and only
# when they are green does the same commit deploy to staging: images built and pushed to the
# shared ECR repositories tagged with the commit SHA, the staging service redeployed with that
# tag, the staging console published.
#
# Production: only on Katlego's say. Run this workflow by hand ("Run workflow"); the production
# environment then waits for Katlego's approval. It deploys a commit that staging already runs,
# by default the one staging runs now, with the images staging tested: nothing is rebuilt.
#
# AWS: each job assumes its stage's deploy role through GitHub OIDC (MothusiCi). Each GitHub
# environment holds the variable DEPLOY_ROLE_ARN, read from /mothusi/<stage>/ci/deploy-role-arn.
# The repository variable MOTHUSI_SERVICES lists the Fargate services to run (default: core).
# The stage's foundation stacks (Network, Data, Front, ModelHost) are deployed by hand; this
# workflow only ever touches <Stage>Service and the console.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to promote to production (blank = the commit staging runs now)
        required: false
        default: ''

permissions:
  contents: read

env:
  AWS_REGION: af-south-1
  AWS_DEFAULT_REGION: af-south-1
  SERVICES: ${{ vars.MOTHUSI_SERVICES || 'core' }}

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/checks.yml

  staging:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ steps.publish.outputs.url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.32'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: ./.github/actions/aws-oidc
        with:
          role-arn: ${{ vars.DEPLOY_ROLE_ARN }}
          stage: staging

      - name: Build and push the service images (tagged with this commit)
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          IFS=',' read -ra names <<<"$SERVICES"
          for name in "${names[@]}"; do
            image="$registry/mothusi-$name:$GITHUB_SHA"
            docker buildx build --platform linux/amd64 -f "services/$name/Dockerfile" -t "$image" --push .
          done

      - name: Redeploy MothusiStagingService with this image tag
        working-directory: infra
        env:
          JSII_RUNTIME_PACKAGE_CACHE: disabled
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx cdk deploy MothusiStagingService --exclusively \
            -c "imageTag=$GITHUB_SHA" -c "services=$SERVICES" --require-approval never

      - id: publish
        uses: ./.github/actions/publish-console
        with:
          stage: staging

  production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Required reviewer: Katlego. Nothing below runs until the deployment is approved.
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      id-token: write
    steps:
      - name: Pick the commit staging runs (or check the one asked for)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # Staging deployments of this repository, newest first, with their latest status.
          ok=""
          while IFS=$'\t' read -r id sha; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')"
            [ "$state" = success ] || continue
            if [ -z "$ASKED" ] || [ "$sha" = "$ASKED" ] || [[ "$sha" == "$ASKED"* && ${#ASKED} -ge 7 ]]; then
              ok="$sha"; break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=staging&per_page=50" \
                     --jq '.[] | [.id, .sha] | @tsv')
          if [ -z "$ok" ]; then
            echo "::error::${ASKED:-No commit} has no successful staging deployment. Production only takes what staging runs."
            exit 1
          fi
          echo "sha=$ok" >> "$GITHUB_OUTPUT"
          echo "Promoting $ok from staging to production." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.32'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: ./.github/actions/aws-oidc
        with:
          role-arn: ${{ vars.DEPLOY_ROLE_ARN }}
          stage: production

      - name: Check staging's images are in ECR (production never builds)
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          IFS=',' read -ra names <<<"$SERVICES"
          for name in "${names[@]}"; do
            aws ecr describe-images --repository-name "mothusi-$name" \
              --image-ids "imageTag=$SHA" --query 'imageDetails[0].imageDigest' --output text
          done

      - name: Redeploy MothusiProductionService with staging's image tag
        working-directory: infra
        env:
          JSII_RUNTIME_PACKAGE_CACHE: disabled
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx cdk deploy MothusiProductionService --exclusively \
            -c "imageTag=$SHA" -c "services=$SERVICES" --require-approval never

      - id: publish
        uses: ./.github/actions/publish-console
        with:
          stage: production
