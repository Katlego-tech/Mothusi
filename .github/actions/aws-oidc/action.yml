name: AWS credentials through GitHub OIDC
description: >
  Exchanges this job's OIDC token for the stage's deploy role. The role trusts only its own
  GitHub environment (repo:<owner>/<repo>:environment:<stage>), so no AWS keys live in the repo.
inputs:
  role-arn:
    description: The stage's deploy role (environment variable DEPLOY_ROLE_ARN)
    required: true
  stage:
    description: staging or production, for the session name
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ROLE_ARN: ${{ inputs.role-arn }}
        STAGE: ${{ inputs.stage }}
      run: |
        set -euo pipefail
        test -n "$ROLE_ARN" || { echo "::error::set the $STAGE environment's variable DEPLOY_ROLE_ARN"; exit 1; }
        token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
        creds="$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" \
          --role-session-name "mothusi-$STAGE-$GITHUB_RUN_ID" --web-identity-token "$token" \
          --duration-seconds 3600 --query Credentials --output json)"
        key="$(jq -r .AccessKeyId <<<"$creds")"
        secret="$(jq -r .SecretAccessKey <<<"$creds")"
        session="$(jq -r .SessionToken <<<"$creds")"
        echo "::add-mask::$key"
        echo "::add-mask::$secret"
        echo "::add-mask::$session"
        {
          echo "AWS_ACCESS_KEY_ID=$key"
          echo "AWS_SECRET_ACCESS_KEY=$secret"
          echo "AWS_SESSION_TOKEN=$session"
        } >> "$GITHUB_ENV"
