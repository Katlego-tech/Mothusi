# Synthetic Grade 10 Mathematics Term 1 Test memo. Not a DBE paper: written for Mothusi's demo
# and tests. Content and weeks from the Grade 10 Mathematics ATP (RATP 2024, DBE), weeks 1-8; the
# test itself is ATP week 9 (14 March). Cognitive levels: knowledge 12, routine 18, complex 14,
# problem solving 6 marks = 24 / 36 / 28 / 12 %, inside the pack's 5-point tolerance of 20/35/30/15.
#
# PLANTED ERROR: item 2.3's answer is wrong on purpose (2^(x+1) = 1/8 gives x = -4, not -2). The
# Setter must catch it before marking starts. See traps.md.

assessment_id = "gr10-maths-t1-test"
total_marks = 50

[[item]]   # ATP week 7: solve quadratic equations by factorisation
question_id = "1.1"
question = "Solve for x: x^2 - x - 6 = 0"
max_marks = 5
answer = "x = 3 or x = -2"
marking_notes = "(x - 3)(x + 2) = 0: 2 marks; x = 3: 1 mark; x = -2: 1 mark; both roots given as the solution: 1 mark"
level = "routine_procedures"

[[item]]   # ATP weeks 1-3: products of algebraic expressions
question_id = "1.2"
question = "Simplify: 3a(2a - 4) - 2(a^2 - 6a) + (a - 2)^2"
max_marks = 6
answer = "5a^2 - 4a + 4"
marking_notes = "6a^2 - 12a: 1 mark; -2a^2 + 12a: 2 marks (the sign); a^2 - 4a + 4: 2 marks; 5a^2 - 4a + 4: 1 mark"
level = "knowledge"

[[item]]   # ATP week 4: multiplication of algebraic fractions (factorisation from weeks 2-3)
question_id = "1.3"
question = "Simplify: (x^2 - 9)/(x^2 + x - 6) * (x - 2)/(x - 3)"
max_marks = 5
answer = "1"
marking_notes = "x^2 - 9 = (x - 3)(x + 3): 1 mark; x^2 + x - 6 = (x + 3)(x - 2): 1 mark; cancelling: 2 marks; answer 1: 1 mark"
level = "routine_procedures"

[[item]]   # ATP week 5: laws of exponents
question_id = "2.1"
question = "Simplify and write with positive exponents: (2x^3 y)^2 * 3x^(-2)"
max_marks = 6
answer = "12x^4 y^2"
marking_notes = "4x^6 y^2: 3 marks; multiplying by 3x^(-2): 2 marks; 12x^4 y^2: 1 mark"
level = "knowledge"

[[item]]   # ATP weeks 5-6: simplify using prime bases
question_id = "2.2"
question = "Simplify: (9^(n+1) * 27^(n-1)) / 81^n"
max_marks = 6
answer = "3^(n-1)"
marking_notes = "3^(2n+2), 3^(3n-3), 3^(4n): 3 marks; adding and subtracting exponents: 2 marks; 3^(n-1): 1 mark"
level = "complex_procedures"

[[item]]   # ATP week 6: exponential equations
question_id = "2.3"
question = "Solve for x: 2^(x+1) = 1/8"
max_marks = 4
answer = "x = -2"
marking_notes = "1/8 = 2^(-3): 2 marks; x + 1 = -3: 1 mark; answer: 1 mark"
level = "routine_procedures"

[[item]]   # ATP week 7: simultaneous linear equations in two unknowns
question_id = "3.1"
question = "Solve simultaneously: y = 2x - 1 and 3x + 2y = 12"
max_marks = 8
answer = "x = 2 and y = 3"
marking_notes = "substitution 3x + 2(2x - 1) = 12: 2 marks; 7x - 2 = 12: 2 marks; x = 2: 2 marks; y = 3: 2 marks"
level = "complex_procedures"

[[item]]   # ATP week 7: linear inequalities, shown on a number line
question_id = "3.2"
question = "Solve for x and show the solution on a number line: 3 - 2x >= 5(x - 1) - 6"
max_marks = 4
answer = "x <= 2"
marking_notes = "3 - 2x >= 5x - 11: 1 mark; 14 >= 7x: 1 mark; x <= 2: 1 mark; number line with a closed dot at 2, shaded to the left: 1 mark"
level = "routine_procedures"

[[item]]   # ATP week 8: word problems leading to linear equations
question_id = "4"
question = "The length of a rectangle is 3 cm more than twice its width. Its perimeter is 48 cm. Find the length and the width."
max_marks = 6
answer = "width 7 cm, length 17 cm"
marking_notes = "l = 2w + 3: 1 mark; 2(w + 2w + 3) = 48: 2 marks; w = 7: 1 mark; l = 17: 1 mark; units (cm): 1 mark"
level = "problem_solving"
