# The 2023/24 Annual Teaching Plan for Mathematics Grade 10 as data, one row per teaching week.
# In force for 2026: Circular S19 of 2025 (DBE, 11 Dec 2025, PDF p 2) keeps the 2023/24 ATPs applicable,
# excluding only CAT, IT, Natural Sciences and Mathematics in Grades 4-5 and 8-9.
