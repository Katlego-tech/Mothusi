[project]
name = "mothusi-delivery"
version = "0.1.0"
description = "Mothusi's delivery seam: the Mailer protocol the Executor sends through, and the Maildir mailer that writes messages to disk for the demo."
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.127",
    "mothusi-contracts",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mothusi_delivery"
